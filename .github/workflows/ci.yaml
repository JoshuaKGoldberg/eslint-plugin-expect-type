jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: pnpm build
      - run: node ./dist/index.cjs
      - run: node ./dist/index.mjs

  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: pnpm build
      - parallel:
          - name: Dedupe Check
            run: pnpm dedupe --check
          - name: Format Check
            run: pnpm format --list-different
          - name: Lint
            run: pnpm lint
          - name: Lint Docs
            run: pnpm lint:docs
          - name: Lint GitHub Actions
            uses: zizmorcore/zizmor-action@v0.8.1
            with:
              advanced-security: "false"
              annotations: "true"
          - name: Lint Knip
            run: pnpm lint:knip
          - name: Lint Knip Production
            run: pnpm lint:knip:production
          - name: Lint Spelling
            run: pnpm lint:spelling
          - name: Type Check
            run: pnpm tsc

  engines_check:
    name: Engines Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          cache: pnpm
          node-version: 20.19.0
      - run: pnpm install --prod --engine-strict --ignore-scripts

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: pnpm run test --coverage
      - env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: always()
        uses: codecov/codecov-action@v7

name: CI

on:
  pull_request: ~
  push:
    branches:
      - main

permissions:
  contents: read
