jobs:
  post_release:
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: echo "npm_version=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - uses: apexskier/github-release-commenter@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          comment-template: |
            :tada: This is included in version {release_link} :tada:

            The release is available on:

            * [GitHub releases](https://github.com/JoshuaKGoldberg/eslint-plugin-expect-type/releases/tag/{release_tag})
            * [npm package (@latest dist-tag)](https://www.npmjs.com/package/eslint-plugin-expect-type/v/${{ env.npm_version }})

            Cheers! 📦🚀

name: Post Release

on:
  release:
    types:
      - published
